name: push

on:
  push:
    branches: [ "main" ]

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run tests with Docker Compose
        run: make ci

      - name: Build production image
        run: docker-compose -f docker-compose.yml build app

      - name: Tag image as latest
        run: docker tag docker-project-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/docker-project:latest

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-project:latest
